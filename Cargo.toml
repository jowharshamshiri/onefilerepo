[package]
name = "onefilerepo"
version = "0.26.124"
edition = "2024"
rust-version = "1.88"
description = "A fast, local-first CLI that turns Git repositories into LLM-ready text digests"
license = "MIT"
repository = "https://github.com/jowharshamshiri/onefilerepo"
readme = "README.md"
keywords = ["git", "github", "llm", "cli", "digest"]
categories = ["command-line-utilities", "development-tools"]
resolver = "3"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
globset = "0.4"
ignore = "0.4"
percent-encoding = "2.3"
rayon = "1.11"
serde_json = "1.0"
tempfile = "3.21"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
